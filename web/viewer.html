<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>CheckDraw — Desenho</title>
<style>
body{margin:0;background:#0b0e15;color:#e2e8f0;font-family:'Segoe UI',sans-serif;display:flex;height:100vh}
#cv{flex:1;background:#fdfdf8;cursor:grab}
#side{width:300px;background:#111827;border-left:1px solid #1f2937;padding:16px;overflow-y:auto}
h3{font-size:13px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.fi{padding:8px;border-radius:8px;margin-bottom:6px;font-size:12px;background:#1f2937;cursor:pointer}
.fi:hover{background:#2c3a52}.fi .s{float:right}
.E,.C{color:#f87171}.W{color:#fbbf24}.I{color:#60a5fa}
#tools{position:fixed;top:12px;right:316px;display:flex;gap:6px}
#tools button{background:#1f2937;border:1px solid #374151;color:#e2e8f0;width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer}
</style></head><body>
<div id="tools"><button onclick="z(1.25)">+</button><button onclick="z(0.8)">−</button><button onclick="fit()">⊡</button></div>
<canvas id="cv"></canvas>
<div id="side"><h3 id="t">Desenho</h3><div id="st" style="font-size:12px;color:#64748b;margin-bottom:14px"></div><h3>Apontamentos</h3><div id="fl"></div></div>
<script>
const P=new URLSearchParams(location.search),API='https://checkdraw-production.up.railway.app';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let ents=[],marks=[],vx=0,vy=0,sc=1;
const file=P.get('file'),src=P.get('src');
document.getElementById('t').textContent=file||'desenho';
function parseDxf(t){ // parser mínimo: LINE/LWPOLYLINE/CIRCLE/TEXT/ATTRIB
 const L=t.split(/\r?\n/).map(s=>s.trim()),E=[];let i=0;
 const pair=()=>[+L[i++],L[i++]];
 while(i<L.length-1){if(L[i]!=='ENTITIES'){i++;continue}i+=2;break}
 while(i<L.length-1){if(L[i]!=='0'){i++;continue}
  const t=L[i+1],e={t};i+=2;
  while(i<L.length-1&&L[i]!=='0'){const c=+L[i],v=L[i+1];(e[c]=e[c]||[]).push(v);i+=2}
  E.push(e)}
 return E}
const num=(e,c,k=0)=>parseFloat((e[c]||[])[k]||0),txt=(e,c)=>((e[c]||[])[0]||'');
function draw(){
 cv.width=cv.clientWidth;cv.height=cv.clientHeight;
 ctx.setTransform(sc,0,0,-sc,vx,vy);ctx.clearRect(-vx/sc,-vy/sc,cv.width/sc,cv.height/sc);
 ctx.lineWidth=1/sc;ctx.strokeStyle='#334';ctx.fillStyle='#334';ctx.font='10px sans-serif';
 for(const e of ents){
  if(e.t==='LINE'){ctx.beginPath();ctx.moveTo(num(e,10),num(e,20));ctx.lineTo(num(e,11),num(e,21));ctx.stroke()}
  if(e.t==='LWPOLYLINE'||e.t==='POLYLINE'){ctx.beginPath();(e[10]||[]).forEach((x,j)=>{const y=num(e,20,j);j?ctx.lineTo(+x,y):ctx.moveTo(+x,y)});if(e[70]==='1')ctx.closePath();ctx.stroke()}
  if(e.t==='CIRCLE'){ctx.beginPath();ctx.arc(num(e,10),num(e,20),num(e,40),0,7);ctx.stroke()}
  if(e.t==='TEXT'||e.t==='ATTRIB')ctx.fillText(txt(e,1),num(e,10),num(e,20))}
 for(const m of marks){
  const c={1:'#facc15',2:'#ef4444',3:'#fb923c',4:'#22c55e'}[m.state]||'#facc15';
  ctx.fillStyle=c+'55';ctx.strokeStyle=c;ctx.lineWidth=1.5/sc;
  ctx.fillRect(m.x,m.y,m.w,m.h);ctx.strokeRect(m.x,m.y,m.w,m.h)}
 // bbox dos findings (relativo 0-1 → px do desenho em coordenadas da imagem)
}
function fit(){if(!ents.length)return;
 const xs=[],ys=[];for(const e of ents)for(const c of[10,11]){if(e[c])xs.push(...e[c].map(Number))}for(const e of ents)for(const c of[20,21]){if(e[c])ys.push(...e[c].map(Number))}
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 sc=Math.min(cv.clientWidth/(x1-x0+40),cv.clientHeight/(y1-y0+40));vx=-x0*sc+20*sc;vy=cv.clientHeight+y0*sc-20*sc;draw()}
function z(f){sc*=f;draw()}
let drag=null;
cv.onmousedown=e=>{drag={x:e.offsetX,y:e.offsetY}};
cv.onmousemove=e=>{if(drag){vx+=e.offsetX-drag.x;vy+=e.offsetY-drag.y;drag={x:e.offsetX,y:e.offsetY};draw()}};
cv.onmouseup=()=>drag=null;cv.onwheel=e=>{e.preventDefault();z(e.deltaY<0?1.1:0.9)};
(async()=>{
 if(src&&file?.endsWith('.dxf')){ents=parseDxf(await(await fetch(src)).text());fit()}
 marks=file?await(await fetch(`${API}/api/marks/${encodeURIComponent(file)}`)).json().catch(()=>[]):[];
 if(marks.length){marks=marks.map(m=>({x:m.x,y:m.y,w:m.w,h:m.h,state:m.state}));draw()}
 const fs=await(await fetch(`${API}/api/findings`)).json().catch(()=>[]);
 document.getElementById('fl').innerHTML=fs.filter(f=>f.fileName===file).map(f=>`<div class="fi"><span class="s ${(f.severity||'I')[0]}">${f.severity}</span><b>${f.ruleId}</b><br>${f.description}${f.suggestedFix?`<br><i style="color:#60a5fa">💡 ${f.suggestedFix}</i>`:''}</div>`).join('')||'<div class="fi">sem apontamentos</div>';
 document.getElementById('st').textContent=`${ents.length} entidades · ${marks.length} marcas`;
})();
</script></body></html>
